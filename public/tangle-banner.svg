<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 384" width="1920" height="384">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="35%" stop-color="#090f17" />
      <stop offset="70%" stop-color="#0b131e" />
      <stop offset="100%" stop-color="#08101a" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="banner-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#162232" stroke-width="0.75" opacity="0.45" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="amber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pin Metal Gradient -->
    <radialGradient id="pin-brass-b" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="384" fill="url(#banner-bg)" />
  <rect width="1920" height="384" fill="url(#banner-grid)" />

  <!-- Left Side: Entangled Tension Network (The Puzzle) -->
  <g id="entangled-left" opacity="0.85">
    <!-- Tension orange crossing threads -->
    <line x1="140" y1="80" x2="340" y2="300" stroke="#f97316" stroke-width="2.5" stroke-dasharray="8 4" filter="url(#amber-glow)" />
    <line x1="140" y1="300" x2="340" y2="80" stroke="#f97316" stroke-width="2.5" stroke-dasharray="8 4" filter="url(#amber-glow)" />
    <line x1="80" y1="192" x2="400" y2="192" stroke="#f97316" stroke-width="2.5" stroke-dasharray="8 4" filter="url(#amber-glow)" />
    <line x1="240" y1="60" x2="240" y2="324" stroke="#f97316" stroke-width="2.5" stroke-dasharray="8 4" filter="url(#amber-glow)" />

    <line x1="140" y1="80" x2="400" y2="192" stroke="#64748b" stroke-width="2" />
    <line x1="140" y1="300" x2="400" y2="192" stroke="#64748b" stroke-width="2" />
    <line x1="340" y1="80" x2="80" y2="192" stroke="#64748b" stroke-width="2" />
    <line x1="340" y1="300" x2="80" y2="192" stroke="#64748b" stroke-width="2" />

    <!-- Red crossing markers -->
    <circle cx="240" cy="192" r="6" fill="#f97316" stroke="#090f17" stroke-width="2" />
    <circle cx="180" cy="125" r="4.5" fill="#f97316" stroke="#090f17" stroke-width="1.5" />
    <circle cx="300" cy="125" r="4.5" fill="#f97316" stroke="#090f17" stroke-width="1.5" />
    <circle cx="180" cy="259" r="4.5" fill="#f97316" stroke="#090f17" stroke-width="1.5" />
    <circle cx="300" cy="259" r="4.5" fill="#f97316" stroke="#090f17" stroke-width="1.5" />

    <!-- Left Pins -->
    <g transform="translate(140, 80)"><circle cx="0" cy="0" r="8" fill="#1e293b" /><circle cx="0" cy="0" r="5" fill="url(#pin-brass-b)" /></g>
    <g transform="translate(340, 80)"><circle cx="0" cy="0" r="8" fill="#1e293b" /><circle cx="0" cy="0" r="5" fill="url(#pin-brass-b)" /></g>
    <g transform="translate(400, 192)"><circle cx="0" cy="0" r="8" fill="#1e293b" /><circle cx="0" cy="0" r="5" fill="url(#pin-brass-b)" /></g>
    <g transform="translate(340, 300)"><circle cx="0" cy="0" r="8" fill="#1e293b" /><circle cx="0" cy="0" r="5" fill="url(#pin-brass-b)" /></g>
    <g transform="translate(140, 300)"><circle cx="0" cy="0" r="8" fill="#1e293b" /><circle cx="0" cy="0" r="5" fill="url(#pin-brass-b)" /></g>
    <g transform="translate(80, 192)"><circle cx="0" cy="0" r="8" fill="#1e293b" /><circle cx="0" cy="0" r="5" fill="url(#pin-brass-b)" /></g>
    <g transform="translate(240, 60)"><circle cx="0" cy="0" r="8" fill="#1e293b" /><circle cx="0" cy="0" r="5" fill="url(#pin-brass-b)" /></g>
    <g transform="translate(240, 324)"><circle cx="0" cy="0" r="8" fill="#1e293b" /><circle cx="0" cy="0" r="5" fill="url(#pin-brass-b)" /></g>
  </g>

  <!-- Central Brand Typography Section -->
  <g transform="translate(680, 192)">
    <!-- Brand Mark Infinity Knot -->
    <g transform="translate(-160, -32) scale(2.6)">
      <path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.083-8-12.356-8-5.096 0-5.096 8 0 8 5.273 0 7.261-8 12.356-8Z"
            fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyan-glow)" />
    </g>

    <!-- Main Title -->
    <text x="-90" y="8" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="64" font-weight="700" letter-spacing="8" fill="#f8fafc">
      TANGLE
    </text>

    <!-- Subtitle -->
    <text x="-86" y="44" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="16" font-weight="600" letter-spacing="3" fill="#38bdf8">
      A DAILY PLANAR KNOT PUZZLE
    </text>

    <!-- Community Pill -->
    <rect x="-86" y="60" width="168" height="26" rx="13" fill="#132132" stroke="#1e3a5f" stroke-width="1" />
    <text x="-2" y="77" font-family="'Geist', -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">
      r/Tangle_daily
    </text>

    <!-- Small Badge Tags -->
    <g transform="translate(95, 60)">
      <rect x="0" y="0" width="134" height="26" rx="13" fill="rgba(52, 211, 153, 0.12)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1" />
      <text x="67" y="17" font-family="'Geist', -apple-system, BlinkMacSystemFont, sans-serif"
            font-size="11.5" font-weight="600" fill="#34d399" text-anchor="middle">
        0 CROSSINGS · PAR
      </text>
    </g>
  </g>

  <!-- Right Side: Untangled Planar Geometry (The Solved State) -->
  <g id="untangled-right" opacity="0.95">
    <!-- Emerald & Cyan Harmonious Non-crossing cycle -->
    <polygon points="1680,64 1800,128 1840,256 1780,336 1600,344 1500,264 1520,136 1610,72"
             fill="none" stroke="#34d399" stroke-width="3" stroke-linejoin="round" filter="url(#cyan-glow)" />

    <!-- Interior non-crossing chords -->
    <line x1="1680" y1="64" x2="1670" y2="204" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="1670" y1="204" x2="1800" y2="128" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="1670" y1="204" x2="1840" y2="256" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="1670" y1="204" x2="1780" y2="336" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="1670" y1="204" x2="1600" y2="344" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="1670" y1="204" x2="1500" y2="264" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="1670" y1="204" x2="1520" y2="136" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="1670" y1="204" x2="1610" y2="72" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Clean Victory Center Pulse -->
    <circle cx="1670" cy="204" r="28" fill="#34d399" opacity="0.1" filter="url(#cyan-glow)" />

    <!-- Right Pins -->
    <g transform="translate(1670, 204)"><circle cx="0" cy="0" r="10" fill="#1e293b" /><circle cx="0" cy="0" r="6.5" fill="url(#pin-brass-b)" /></g>
    <g transform="translate(1680, 64)"><circle cx="0" cy="0" r="8" fill="#1e293b" /><circle cx="0" cy="0" r="5" fill="url(#pin-brass-b)" /></g>
    <g transform="translate(1800, 128)"><circle cx="0" cy="0" r="8" fill="#1e293b" /><circle cx="0" cy="0" r="5" fill="url(#pin-brass-b)" /></g>
    <g transform="translate(1840, 256)"><circle cx="0" cy="0" r="8" fill="#1e293b" /><circle cx="0" cy="0" r="5" fill="url(#pin-brass-b)" /></g>
    <g transform="translate(1780, 336)"><circle cx="0" cy="0" r="8" fill="#1e293b" /><circle cx="0" cy="0" r="5" fill="url(#pin-brass-b)" /></g>
    <g transform="translate(1600, 344)"><circle cx="0" cy="0" r="8" fill="#1e293b" /><circle cx="0" cy="0" r="5" fill="url(#pin-brass-b)" /></g>
    <g transform="translate(1500, 264)"><circle cx="0" cy="0" r="8" fill="#1e293b" /><circle cx="0" cy="0" r="5" fill="url(#pin-brass-b)" /></g>
    <g transform="translate(1520, 136)"><circle cx="0" cy="0" r="8" fill="#1e293b" /><circle cx="0" cy="0" r="5" fill="url(#pin-brass-b)" /></g>
    <g transform="translate(1610, 72)"><circle cx="0" cy="0" r="8" fill="#1e293b" /><circle cx="0" cy="0" r="5" fill="url(#pin-brass-b)" /></g>
  </g>

  <!-- Corner Blueprint Coordinate Markings -->
  <text x="32" y="32" font-family="monospace" font-size="10" fill="#334155">TOPOLOGY: PLANAR GRAPH K_n</text>
  <text x="32" y="360" font-family="monospace" font-size="10" fill="#334155">UNTANGLE SYSTEM · V0.0.6</text>
  <text x="1888" y="32" font-family="monospace" font-size="10" fill="#334155" text-anchor="end">COORD: [1920 × 384]</text>
  <text x="1888" y="360" font-family="monospace" font-size="10" fill="#334155" text-anchor="end">SOLVABLE · 0 CROSSINGS</text>
</svg>
