<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Deep architectural dark background -->
  <rect width="512" height="512" fill="#0b0e14" />
  
  <!-- Subtle circular ambient backdrop glow -->
  <radialGradient id="icon-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
    <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.0" />
  </radialGradient>
  <circle cx="256" cy="256" r="220" fill="url(#icon-glow)" />

  <!-- Exact Tangle Infinity Knot Logo -->
  <!-- Scaled up from 24x24 viewBox: center at (256, 256), scale = 14x -->
  <!-- Original center was at (12, 12). 256 - 12*14 = 88. Transform: translate(88, 88) scale(14) -->
  <g transform="translate(88, 88) scale(14)">
    <path
      d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.083-8-12.356-8-5.096 0-5.096 8 0 8 5.273 0 7.261-8 12.356-8Z"
      fill="none"
      stroke="#38bdf8"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
