<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 384" width="1920" height="384">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060a10" />
      <stop offset="50%" stop-color="#09101a" />
      <stop offset="100%" stop-color="#060a10" />
    </linearGradient>

    <!-- Subtle Architectural Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#131d2c" stroke-width="0.75" opacity="0.6" />
    </pattern>

    <!-- Cyan Ambient Glow -->
    <radialGradient id="glow" cx="45%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Background Layers -->
  <rect width="1920" height="384" fill="url(#bg)" />
  <rect width="1920" height="384" fill="url(#grid)" />
  <rect width="1920" height="384" fill="url(#glow)" />

  <!-- Center Group -->
  <!-- Knot Icon + TANGLE Wordmark + Subtitle -->
  <g transform="translate(620, 192)">
    <!-- Exact Vector Infinity Knot Logo -->
    <!-- Scaled from 24x24 viewBox: height = 110px, scale = 4.6x -->
    <!-- Centered vertically: y = -55px -->
    <g transform="translate(-160, -55) scale(4.6)">
      <path
        d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.083-8-12.356-8-5.096 0-5.096 8 0 8 5.273 0 7.261-8 12.356-8Z"
        fill="none"
        stroke="#38bdf8"
        stroke-width="2.3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>

    <!-- Main Title -->
    <text
      x="-20"
      y="12"
      font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="64"
      font-weight="700"
      letter-spacing="10"
      fill="#f8fafc"
    >
      TANGLE
    </text>

    <!-- Subtitle -->
    <text
      x="-16"
      y="48"
      font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="15"
      font-weight="600"
      letter-spacing="4"
      fill="#38bdf8"
    >
      A DAILY PLANAR KNOT PUZZLE
    </text>

    <!-- Community Pill Badge -->
    <g transform="translate(-16, 64)">
      <rect x="0" y="0" width="160" height="24" rx="12" fill="#101a28" stroke="#1d2e45" stroke-width="1" />
      <text
        x="80"
        y="16"
        font-family="'Geist', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="11.5"
        font-weight="600"
        fill="#8a9ba8"
        text-anchor="middle"
      >
        r/Tangle_daily
      </text>
    </g>

    <!-- Feature Tags -->
    <g transform="translate(156, 64)">
      <rect x="0" y="0" width="144" height="24" rx="12" fill="rgba(52, 211, 153, 0.08)" stroke="rgba(52, 211, 153, 0.25)" stroke-width="1" />
      <text
        x="72"
        y="16"
        font-family="'Geist', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="11"
        font-weight="600"
        fill="#34d399"
        text-anchor="middle"
      >
        UNTANGLE TO 0 CROSSINGS
      </text>
    </g>
  </g>

  <!-- Left/Right Coordinate Watermarks -->
  <text x="36" y="40" font-family="monospace" font-size="11" fill="#243447" letter-spacing="1">ARCHETYPE: PLANAR GRAPH KNOT</text>
  <text x="36" y="354" font-family="monospace" font-size="11" fill="#243447" letter-spacing="1">DEVVIT APP: TANGLE-DAILY</text>
  <text x="1884" y="40" font-family="monospace" font-size="11" fill="#243447" letter-spacing="1" text-anchor="end">CANVAS: 1920 × 384</text>
  <text x="1884" y="354" font-family="monospace" font-size="11" fill="#243447" letter-spacing="1" text-anchor="end">PAR RATING · LEADERBOARDS</text>
</svg>
